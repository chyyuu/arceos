[package]
name = "arceos-helloworld"
version = "0.1.0"
edition = "2024"
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "A simple Hello World example for ArceOS"
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
repository = "https://github.com/arceos-org/arceos"
homepage = "https://github.com/arceos-org/arceos"
keywords = ["arceos", "os", "kernel", "example"]
categories = ["no-std", "embedded"]
readme = "README.md"

# Exclude ArceOS-specific files from the published crate
exclude = [
    "axconfig.toml",
    "run-qemu.sh",
    ".cargo/",
]

[features]
default = []
# The 'axstd' feature enables ArceOS support (no_std + no_main).
# Note: When building from the ArceOS repository with `make`, axstd is
# automatically provided. For standalone use, see README.md.
axstd = []
